<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دفتر گزارش کار | دوازدهم ریاضی</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<style>
  :root{
    --bg:#0b1020;
    --card:rgba(255,255,255,.045);
    --border:rgba(255,255,255,.09);
    --text:#e8ecf8;
    --muted:#8d97b5;
    --accent:#6c8cff;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Vazirmatn', Tahoma, system-ui, sans-serif;
    color:var(--text);
    min-height:100vh;
    padding:28px 18px 90px;
    background:
      radial-gradient(1000px 620px at 100% -5%, rgba(108,140,255,.20), transparent 60%),
      radial-gradient(900px 520px at -5% 105%, rgba(176,108,255,.18), transparent 60%),
      var(--bg);
    background-attachment:fixed;
  }
  .wrap{max-width:1320px;margin:0 auto;}

  /* هدر */
  .top{display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:space-between;margin-bottom:22px;}
  .brand{display:flex;align-items:center;gap:14px;}
  .logo{width:54px;height:54px;border-radius:17px;display:grid;place-items:center;font-size:26px;flex:none;background:linear-gradient(135deg,#6c8cff,#b06cff);box-shadow:0 12px 34px rgba(108,140,255,.4);}
  h1{font-size:21px;margin:0 0 5px;font-weight:700;letter-spacing:-.3px;}
  .sub{color:var(--muted);font-size:12.5px;margin:0;}
  .actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}

  .btn{
    border:1px solid var(--border);background:rgba(255,255,255,.06);
    color:var(--text);padding:11px 18px;border-radius:13px;cursor:pointer;
    font-family:inherit;font-size:13.5px;font-weight:500;transition:.2s;
    display:inline-flex;align-items:center;gap:7px;
  }
  .btn:hover{background:rgba(255,255,255,.12);transform:translateY(-1px);}
  .btn:active{transform:translateY(0);}
  .btn.primary{background:linear-gradient(135deg,#6c8cff,#8b5cf6);border-color:transparent;box-shadow:0 10px 28px rgba(108,140,255,.38);}
  .btn.primary:hover{filter:brightness(1.08);}
  .btn.danger:hover{background:rgba(255,90,90,.14);border-color:rgba(255,90,90,.42);color:#ffb3b3;}
  .btn.small{padding:7px 13px;font-size:12px;border-radius:10px;}

  .saved-at{font-size:11.5px;color:var(--muted);padding:8px 13px;border-radius:11px;background:rgba(255,255,255,.04);border:1px solid var(--border);white-space:nowrap;}

  /* آمار کلی */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px;}
  .stat{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:14px 16px;backdrop-filter:blur(12px);transition:.25s;}
  .stat:hover{border-color:rgba(108,140,255,.32);transform:translateY(-2px);}
  .stat-label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:8px;}
  .stat-value{font-size:19px;font-weight:700;background:linear-gradient(135deg,#ffffff,#9fb2ff);-webkit-background-clip:text;background-clip:text;color:transparent;}

  /* تب‌ها */
  .tabs{
    display:flex;gap:8px;margin-bottom:20px;
    background:rgba(255,255,255,.04);border:1px solid var(--border);
    border-radius:16px;padding:6px;
  }
  .tab{
    flex:1;padding:12px 16px;border-radius:12px;border:none;
    background:transparent;color:var(--muted);font-family:inherit;
    font-size:14px;font-weight:600;cursor:pointer;transition:.2s;
  }
  .tab:hover{color:var(--text);}
  .tab.active{
    background:linear-gradient(135deg,#6c8cff,#8b5cf6);
    color:#fff;box-shadow:0 6px 20px rgba(108,140,255,.35);
  }

  /* روزها */
  .days{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;}
  .day-card{
    background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.022));
    border:1px solid var(--border);border-radius:20px;padding:16px;
    backdrop-filter:blur(14px);transition:.25s;
  }
  .day-card:hover{border-color:rgba(108,140,255,.3);}
  .day-card.has-data{border-color:rgba(108,140,255,.45);box-shadow:0 0 0 1px rgba(108,140,255,.14), 0 14px 36px rgba(0,0,0,.35);}
  .day-card.today{background:linear-gradient(180deg,rgba(108,140,255,.14),rgba(255,255,255,.025));border-color:rgba(108,140,255,.4);}

  .day-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px;}
  .day-head h3{margin:0;font-size:15.5px;font-weight:700;display:flex;align-items:center;gap:8px;}
  .today-tag{font-size:10px;font-weight:600;padding:3px 8px;border-radius:999px;background:linear-gradient(135deg,#6c8cff,#8b5cf6);color:#fff;}
  .day-badge{font-size:11px;padding:5px 11px;border-radius:999px;white-space:nowrap;background:rgba(108,140,255,.16);color:#a9bdff;border:1px solid rgba(108,140,255,.28);transition:.25s;}
  .day-badge.idle{background:rgba(255,255,255,.05);color:var(--muted);border-color:var(--border);}

  .tbl-head,.tbl-row{display:grid;gap:7px;align-items:center;}
  .tbl-head.fields-4,.tbl-row.fields-4{grid-template-columns:1.4fr .65fr .65fr .7fr .75fr;}
  .tbl-head.fields-3,.tbl-row.fields-3{grid-template-columns:1.4fr .8fr .8fr .95fr;}
  .tbl-head{font-size:11px;color:var(--muted);padding:0 7px 9px;text-align:center;}
  .tbl-head span:first-child{text-align:right;}

  .tbl-row{padding:5px;border-radius:12px;transition:.2s;}
  .tbl-row:hover{background:rgba(255,255,255,.04);}

  .subj{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:500;}
  .subj i{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block;}

  .tbl-row input{
    width:100%;background:rgba(0,0,0,.26);border:1px solid var(--border);
    border-radius:10px;color:var(--text);font-family:inherit;font-size:13px;
    padding:8px 4px;text-align:center;outline:none;transition:.2s;
    -moz-appearance:textfield;
  }
  .tbl-row input::-webkit-outer-spin-button,
  .tbl-row input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .tbl-row input::placeholder{color:rgba(141,151,181,.45);}
  .tbl-row input:focus{border-color:rgba(108,140,255,.75);background:rgba(108,140,255,.1);box-shadow:0 0 0 3px rgba(108,140,255,.13);}

  /* پنل‌ها */
  .panel{margin-top:22px;padding:22px;background:var(--card);border:1px solid var(--border);border-radius:20px;backdrop-filter:blur(12px);}
  .panel h2{margin:0 0 16px;font-size:16px;font-weight:700;display:flex;align-items:center;gap:10px;}

  table.summary{width:100%;border-collapse:collapse;font-size:13px;}
  .summary th{text-align:right;font-size:11.5px;color:var(--muted);font-weight:500;padding:9px 10px;border-bottom:1px solid var(--border);}
  .summary td{padding:10px;border-bottom:1px solid rgba(255,255,255,.05);}
  .summary th:not(:first-child),
  .summary td:not(:first-child){text-align:center;}
  .summary tr:last-child td{border-bottom:none;}
  .summary .total-row td{font-weight:700;background:rgba(108,140,255,.09);}
  .summary .total-row td:first-child{border-radius:0 12px 12px 0;}
  .summary .total-row td:last-child{border-radius:12px 0 0 12px;}

  /* آرشیو */
  .archive-list{display:grid;gap:14px;}
  .archive-empty{text-align:center;color:var(--muted);font-size:13.5px;padding:30px 10px;}

  .archive-card{
    background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));
    border:1px solid var(--border);border-radius:16px;padding:16px;transition:.25s;
  }
  .archive-card:hover{border-color:rgba(108,140,255,.3);}
  .archive-head{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-start;margin-bottom:12px;}
  .archive-date{font-size:14.5px;font-weight:700;margin-bottom:5px;}
  .archive-save-time{font-size:11.5px;color:var(--muted);}
  .archive-totals{display:flex;flex-wrap:wrap;gap:8px;}
  .arch-total{
    font-size:11.5px;padding:5px 11px;border-radius:999px;
    background:rgba(108,140,255,.13);color:#a9bdff;
    border:1px solid rgba(108,140,255,.25);
    white-space:nowrap;
  }
  .archive-actions{display:flex;flex-wrap:wrap;gap:8px;}

  .archive-detail{margin-top:14px;padding-top:14px;border-top:1px dashed var(--border);}
  .archive-detail h4{font-size:13px;margin:0 0 10px;color:var(--muted);font-weight:600;}
  .archive-detail .summary{font-size:12.5px;}
  .archive-detail .summary th,
  .archive-detail .summary td{padding:7px 9px;}

  /* توست */
  .toast{
    position:fixed;bottom:28px;left:50%;transform:translate(-50%,140%);
    background:linear-gradient(135deg,#6c8cff,#8b5cf6);color:#fff;
    padding:13px 28px;border-radius:14px;font-size:13.5px;font-weight:600;
    box-shadow:0 16px 44px rgba(108,140,255,.48);
    transition:transform .38s cubic-bezier(.2,.9,.3,1.35);
    z-index:99;pointer-events:none;
  }
  .toast.show{transform:translate(-50%,0);}

  .hidden{display:none !important;}

  /* موبایل */
  @media (max-width:560px){
    body{padding:18px 12px 80px;}
    h1{font-size:18px;}
    .logo{width:46px;height:46px;font-size:22px;border-radius:14px;}
    .btn{padding:9px 14px;font-size:12.5px;}
    .days{grid-template-columns:1fr;}
    .tbl-head.fields-4,.tbl-row.fields-4{grid-template-columns:1.15fr .65fr .65fr .7fr .75fr;gap:5px;}
    .tbl-head.fields-3,.tbl-row.fields-3{grid-template-columns:1.15fr .8fr .8fr .95fr;gap:5px;}
    .tbl-row input{font-size:12px;padding:7px 3px;}
    .subj{font-size:11.5px;gap:6px;}
    .subj i{width:7px;height:7px;}
    .saved-at{font-size:10.5px;}
    .tab{font-size:12.5px;padding:10px 12px;}
    .archive-head{flex-direction:column;align-items:stretch;}
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- هدر -->
  <header class="top">
    <div class="brand">
      <div class="logo">📘</div>
      <div>
        <h1>دفتر گزارش کار</h1>
        <p class="sub">پایه دوازدهم ریاضی · ثبت هفتگی</p>
      </div>
    </div>
    <div class="actions">
      <span class="saved-at" id="savedAt">هنوز ذخیره نشده</span>
      <button class="btn primary" id="saveBtn">💾 ذخیره هفته</button>
      <button class="btn danger" id="clearBtn">🗑 پاک کردن فرم</button>
    </div>
  </header>

  <!-- آمار کلی -->
  <section class="stats">
    <div class="stat"><span class="stat-label">مجموع صفحات</span><span class="stat-value" id="sumPages">۰</span></div>
    <div class="stat"><span class="stat-label">تست‌های تخصصی</span><span class="stat-value" id="sumTests">۰</span></div>
    <div class="stat"><span class="stat-label">مجموع تشریحی</span><span class="stat-value" id="sumEssays">۰</span></div>
    <div class="stat"><span class="stat-label">مجموع زمان</span><span class="stat-value" id="sumTime">۰ دقیقه</span></div>
    <div class="stat"><span class="stat-label">میانگین روزانه</span><span class="stat-value" id="avgTime">۰ دقیقه</span></div>
  </section>

  <!-- تب‌ها -->
  <div class="tabs">
    <button class="tab active" data-tab="special">📐 دروس تخصصی</button>
    <button class="tab" data-tab="general">📚 دروس عمومی</button>
  </div>

  <!-- روزهای تخصصی -->
  <section class="days" id="daysGridSpecial"></section>

  <!-- روزهای عمومی -->
  <section class="days hidden" id="daysGridGeneral"></section>

  <!-- جمع کل تخصصی -->
  <section class="panel" id="summarySpecial">
    <h2>📊 جمع کل هفته — دروس تخصصی</h2>
    <table class="summary">
      <thead><tr><th>درس</th><th>صفحه</th><th>تستی</th><th>تشریحی</th><th>زمان</th></tr></thead>
      <tbody id="summaryBodySpecial"></tbody>
    </table>
  </section>

  <!-- جمع کل عمومی -->
  <section class="panel hidden" id="summaryGeneral">
    <h2>📊 جمع کل هفته — دروس عمومی</h2>
    <table class="summary">
      <thead><tr><th>درس</th><th>صفحه</th><th>تشریحی</th><th>زمان</th></tr></thead>
      <tbody id="summaryBodyGeneral"></tbody>
    </table>
  </section>

  <!-- آرشیو هفته‌ها -->
  <section class="panel">
    <h2>🗂 آرشیو هفته‌های گذشته <span style="font-size:12px;color:var(--muted);font-weight:400;" id="archiveCount"></span></h2>
    <div class="archive-list" id="archiveList"></div>
  </section>

</div>

<div class="toast" id="toast">ذخیره شد</div>

<script>
/* ================== داده‌ها ================== */
const DAYS = ['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه'];

const SPECIALIZED = [
  { name:'حسابان', color:'#6c8cff' },
  { name:'فیزیک',  color:'#38bdf8' },
  { name:'شیمی',   color:'#34d399' },
  { name:'هندسه',  color:'#fbbf24' },
  { name:'گسسته',  color:'#f472b6' },
];

const GENERAL = [
  { name:'دینی',          color:'#a78bfa' },
  { name:'فارسی',         color:'#fb923c' },
  { name:'سلامت و بهداشت', color:'#4ade80' },
  { name:'زبان',          color:'#60a5fa' },
  { name:'نگارش',         color:'#f87171' },
  { name:'عربی',          color:'#facc15' },
  { name:'علوم اجتماعی',  color:'#22d3ee' },
];

const SPECIALIZED_FIELDS = ['pages','tests','essays','time'];
const GENERAL_FIELDS     = ['pages','essays','time'];
const FIELD_LABELS = { pages:'صفحه', tests:'تستی', essays:'تشریحی', time:'زمان' };

const CURRENT_KEY = 'gozaresh-current-v3';
const ARCHIVE_KEY = 'gozaresh-archive-v3';

/* ================== ابزار ================== */
const $ = s => document.querySelector(s);
const fa = n => Number(n).toLocaleString('fa-IR');
const num = v => { const n = parseFloat(v); return Number.isFinite(n) && n > 0 ? n : 0; };

function fmtTime(m){
  m = Math.round(m);
  if (!m) return '۰';
  const h = Math.floor(m/60), r = m%60;
  if (h && r) return `${fa(h)}:${String(r).padStart(2,'0')}`;
  if (h) return `${fa(h)} ساعت`;
  return `${fa(r)} دقیقه`;
}
function fmtTimeLong(m){
  m = Math.round(m);
  if (!m) return '۰ دقیقه';
  const h = Math.floor(m/60), r = m%60;
  if (h && r) return `${fa(h)} ساعت و ${fa(r)} دقیقه`;
  if (h) return `${fa(h)} ساعت`;
  return `${fa(r)} دقیقه`;
}

const todayIdx = (new Date().getDay() + 1) % 7;

/* ================== ساختار داده ================== */
function createEmptyDay(){
  const d = {};
  SPECIALIZED.forEach(s => d[s.name] = { pages:'', tests:'', essays:'', time:'' });
  GENERAL.forEach(s => d[s.name]     = { pages:'', essays:'', time:'' });
  return d;
}
function createEmptyState(){
  const s = {};
  DAYS.forEach(d => s[d] = createEmptyDay());
  return s;
}
function normalizeState(raw){
  const s = createEmptyState();
  if (!raw || typeof raw !== 'object') return s;
  DAYS.forEach(d => {
    [...SPECIALIZED, ...GENERAL].forEach(sub => {
      const v = raw?.[d]?.[sub.name];
      if (v && typeof v === 'object') {
        const fields = SPECIALIZED.some(x => x.name === sub.name)
          ? SPECIALIZED_FIELDS : GENERAL_FIELDS;
        fields.forEach(f => { if (v[f] != null && v[f] !== '') s[d][sub.name][f] = String(v[f]); });
      }
    });
  });
  return s;
}

/* ================== محاسبه ================== */
function calcTotals(data){
  const per = {};
  [...SPECIALIZED, ...GENERAL].forEach(s => per[s.name] = { pages:0, tests:0, essays:0, time:0 });
  let totPages = 0, totTests = 0, totEssays = 0, totTime = 0;

  DAYS.forEach(day => {
    [...SPECIALIZED, ...GENERAL].forEach(s => {
      const v = data?.[day]?.[s.name];
      if (!v) return;
      const p = num(v.pages), t = num(v.tests), e = num(v.essays), ti = num(v.time);
      per[s.name].pages  += p;
      per[s.name].tests  += t;
      per[s.name].essays += e;
      per[s.name].time   += ti;
      totPages += p; totTests += t; totEssays += e; totTime += ti;
    });
  });

  return { per, totPages, totTests, totEssays, totTime };
}

/* ================== تاریخ ================== */
function getWeekStart(){
  const now = new Date();
  const day = now.getDay();
  const diff = (day + 1) % 7; // شنبه = 0
  const s = new Date(now);
  s.setDate(now.getDate() - diff);
  s.setHours(0,0,0,0);
  return s;
}
function getWeekKey(){
  return getWeekStart().toISOString().split('T')[0];
}
function formatWeekLabel(){
  const s = getWeekStart();
  const e = new Date(s); e.setDate(s.getDate() + 6);
  const opts = { day:'numeric', month:'long' };
  return `${s.toLocaleDateString('fa-IR', opts)} تا ${e.toLocaleDateString('fa-IR', opts)}`;
}
function formatDateFull(d){
  return d.toLocaleDateString('fa-IR', { weekday:'long', year:'numeric', month:'long', day:'numeric' });
}
function formatSaveTime(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('fa-IR', { month:'long', day:'numeric' }) + ' — ' +
         d.toLocaleTimeString('fa-IR', { hour:'2-digit', minute:'2-digit' });
}

/* ================== ذخیره‌سازی ================== */
let state = createEmptyState();
let archive = [];
let activeTab = 'special';

function loadStore(){
  try{
    const c = JSON.parse(localStorage.getItem(CURRENT_KEY));
    if (c) state = normalizeState(c);
    const a = JSON.parse(localStorage.getItem(ARCHIVE_KEY));
    if (Array.isArray(a)) archive = a;
  }catch(e){}
}

function saveCurrent(){
  localStorage.setItem(CURRENT_KEY, JSON.stringify(state));
}
let saveTimer;
function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveCurrent, 500);
}

function saveWeekSnapshot(){
  const weekKey = getWeekKey();
  const idx = archive.findIndex(w => w.weekKey === weekKey);
  const entry = {
    weekKey,
    weekLabel: formatWeekLabel(),
    savedAt: new Date().toISOString(),
    data: JSON.parse(JSON.stringify(state)),
  };
  if (idx >= 0) archive[idx] = entry;
  else archive.unshift(entry);
  archive.sort((a,b) => b.weekKey.localeCompare(a.weekKey));
  localStorage.setItem(ARCHIVE_KEY, JSON.stringify(archive));
  renderArchive();
}

/* ================== رندر روزها ================== */
function renderDayCard(day, i, subjects, fields){
  const cls = fields.length === 4 ? 'fields-4' : 'fields-3';
  return `
    <article class="day-card ${i === todayIdx ? 'today' : ''}" data-card="${day}-${cls}">
      <header class="day-head">
        <h3>${day}${i === todayIdx ? '<span class="today-tag">امروز</span>' : ''}</h3>
        <span class="day-badge idle" data-day-badge="${day}-${cls}">—</span>
      </header>
      <div class="tbl">
        <div class="tbl-head ${cls}">
          <span>درس</span>
          ${fields.map(f => `<span>${FIELD_LABELS[f]}</span>`).join('')}
        </div>
        ${subjects.map(s => `
          <div class="tbl-row ${cls}">
            <span class="subj"><i style="background:${s.color}"></i>${s.name}</span>
            ${fields.map(f => `
              <input type="number" min="0" step="1" inputmode="numeric" placeholder="0"
                     data-day="${day}" data-subj="${s.name}" data-field="${f}">
            `).join('')}
          </div>
        `).join('')}
      </div>
    </article>
  `;
}

function render(){
  $('#daysGridSpecial').innerHTML = DAYS.map((d,i) => renderDayCard(d, i, SPECIALIZED, SPECIALIZED_FIELDS)).join('');
  $('#daysGridGeneral').innerHTML = DAYS.map((d,i) => renderDayCard(d, i, GENERAL, GENERAL_FIELDS)).join('');

  document.querySelectorAll('input[data-day]').forEach(inp => {
    const { day, subj, field } = inp.dataset;
    inp.value = state[day][subj][field] ?? '';
  });
}

/* ================== به‌روزرسانی ================== */
function updateAll(){
  const { per, totPages, totTests, totEssays, totTime } = calcTotals(state);

  // آمار کلی
  $('#sumPages').textContent = fa(totPages);
  $('#sumTests').textContent = fa(totTests);
  $('#sumEssays').textContent = fa(totEssays);
  $('#sumTime').textContent  = fmtTimeLong(totTime);
  $('#avgTime').textContent  = fmtTimeLong(totTime / 7);

  // بج روزها
  DAYS.forEach(day => {
    let timeSpec = 0, timeGen = 0, hasSpec = false, hasGen = false;
    SPECIALIZED.forEach(s => {
      const v = state[day][s.name];
      if (!v) return;
